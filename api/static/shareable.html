<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
:root {
  --bg: #080808;
  --surface: #0f0f0f;
  --surface2: #161616;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #e2e2e2;
  --text2: #9a9a9a;
  --text3: #5f5f5f;
  --blue: #60a5fa;
  --green: #4ade80;
  --amber: #fbbf24;
  --red: #f87171;
}
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "DM Sans", system-ui, sans-serif;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
.wrap {
  position: relative;
  z-index: 1;
  max-width: 980px;
  margin: 0 auto;
  padding: 32px 20px 56px;
}
.eyebrow, .label, .tiny, .pill {
  font-family: "DM Mono", monospace;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--text3);
  margin-bottom: 6px;
}
.title {
  margin: 0;
  font-family: "Syne", sans-serif;
  font-size: clamp(2rem, 4vw, 3rem);
  line-height: 1.05;
}
.title span { color: var(--blue); }
.sub {
  color: var(--text2);
  margin: 10px 0 0;
  font-size: 14px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-top: 16px;
}
.label, .tiny {
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.label { font-size: 10px; margin-bottom: 8px; }
.tiny { font-size: 10px; }
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.pill {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 999px;
  border: 1px solid var(--border2);
  font-size: 11px;
  color: var(--text2);
}
.muted { color: var(--text2); font-size: 14px; }
.approach-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-top: 12px;
}
.approach-card.top {
  border-color: rgba(74,222,128,0.25);
}
.approach-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 8px;
}
.score {
  text-align: right;
  min-width: 76px;
}
.num {
  display: block;
  font-family: "Syne", sans-serif;
  font-size: 24px;
  line-height: 1;
}
.detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.detail-card {
  background: #111;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}
.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.tag {
  display: inline-block;
  padding: 3px 7px;
  border-radius: 6px;
  font-size: 11px;
}
.warn { background: rgba(251,191,36,0.1); color: #fcd34d; border: 1px solid rgba(251,191,36,0.15); }
.fail { background: rgba(248,113,113,0.1); color: #fca5a5; border: 1px solid rgba(248,113,113,0.15); }
@media (max-width: 760px) {
  .grid, .detail-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">ADVERSARIAL FRAMING ENGINE</div>
  <h1 class="title">Shared <span>Analysis</span></h1>
  <p class="sub">Read-only public view of a saved adversarial framing result.</p>
  <div id="app"></div>
</div>

<script id="analysis-data" type="application/json">__ANALYSIS_JSON__</script>
<script>
function esc(value) {
  return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function fmtDateTime(value) {
  if (!value) return "-";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return value;
  return d.toLocaleString(undefined, {
    year: "numeric", month: "short", day: "numeric",
    hour: "2-digit", minute: "2-digit"
  });
}
const data = JSON.parse(document.getElementById("analysis-data").textContent);
const ranked = Array.isArray(data.ranked) ? data.ranked : [];
document.getElementById("app").innerHTML = `
  <section class="card">
    <div class="label">Problem</div>
    <div>${esc(data.problem || "")}</div>
  </section>
  <section class="grid" style="margin-top:16px;">
    <div class="card">
      <div class="label">Domain</div>
      <div class="pill">${esc(data.domain || "general")}</div>
    </div>
    <div class="card">
      <div class="label">Created</div>
      <div>${esc(fmtDateTime(data.created_at))}</div>
    </div>
    <div class="card">
      <div class="label">Consensus pressure</div>
      <div>${esc(data.consensus && data.consensus.pressure_label ? data.consensus.pressure_label : "-")}</div>
    </div>
  </section>
  <section class="card">
    <div class="label">Consensus</div>
    <div class="muted">${esc(data.consensus && data.consensus.consensus ? data.consensus.consensus : "")}</div>
  </section>
  <section class="card">
    <div class="label">Ranked approaches</div>
    ${ranked.map((item, index) => {
      const weaknesses = Array.isArray(item?.critique?.weaknesses) ? item.critique.weaknesses : [];
      const failures = Array.isArray(item?.critique?.failure_modes) ? item.critique.failure_modes : [];
      return `
        <article class="approach-card ${index === 0 ? "top" : ""}">
          <div class="approach-top">
            <div>
              <div class="tiny">${index === 0 ? "Top approach" : "Alternative"}</div>
              <h3 style="margin:4px 0 6px;">${esc(item?.approach || "")}</h3>
              <div class="pill">${esc(item?.lens || "")}</div>
            </div>
            <div class="score">
              <span class="tiny">Composite</span>
              <span class="num">${item?.composite != null ? esc(Number(item.composite).toFixed(3)) : "-"}</span>
            </div>
          </div>
          <p class="muted">${esc(item?.reasoning || "")}</p>
          <div class="detail-grid">
            <div class="detail-card"><div class="label">Novelty</div><div>${esc(item?.scores?.novelty ?? "-")}</div></div>
            <div class="detail-card"><div class="label">Feasibility</div><div>${esc(item?.scores?.feasibility ?? "-")}</div></div>
            <div class="detail-card"><div class="label">Risk</div><div>${esc(item?.scores?.risk ?? "-")}</div></div>
            <div class="detail-card"><div class="label">Expected impact</div><div>${esc(item?.scores?.expected_impact ?? "-")}</div></div>
          </div>
          <div class="tiny" style="margin-top:12px;">Weaknesses</div>
          <div class="tag-row">${weaknesses.length ? weaknesses.map(x => `<span class="tag warn">${esc(x)}</span>`).join("") : `<span class="muted">None captured.</span>`}</div>
          <div class="tiny" style="margin-top:12px;">Failure modes</div>
          <div class="tag-row">${failures.length ? failures.map(x => `<span class="tag fail">${esc(x)}</span>`).join("") : `<span class="muted">None captured.</span>`}</div>
        </article>
      `;
    }).join("")}
  </section>
`;
</script>
</body>
</html>
